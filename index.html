<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🫶</title>
<meta name="theme-color" content="#1a1114">
<meta property="og:title" content="🫶">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.85em' font-size='90'%3E🫶%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg-deep: #1a1114;
    --bg-mid: #2b141c;
    --glow: #ff8fa3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 45%, var(--bg-mid) 0%, var(--bg-deep) 70%);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
  }
  .glow {
    position: absolute;
    width: min(70vw, 70vh);
    height: min(70vw, 70vh);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,143,163,0.28) 0%, rgba(255,143,163,0) 70%);
    animation: breathe 4s ease-in-out infinite;
    filter: blur(10px);
  }
  .heart {
    position: relative;
    font-size: clamp(4rem, 22vw, 11rem);
    line-height: 1;
    user-select: none;
    -webkit-user-select: none;
    animation: breathe 4s ease-in-out infinite;
    filter: drop-shadow(0 0 40px rgba(255,143,163,0.35));
    cursor: default;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  @media (prefers-reduced-motion: reduce) {
    .glow, .heart { animation: none; }
  }
</style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <div class="heart" role="img" aria-label="Heart hands emoji">🫶</div>
</body>
</html>
